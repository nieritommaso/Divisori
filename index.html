<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    

</head>
<body>

    <div class="bg-warning text-center py-4 my-4">
        <h1>SCRIPT JAVASCRIPT</h1>  
        <p>Una collezione di script Javascript</p>
    </div>


    <div class="row text-center">

        <div class="col-sm-4 border border-warning">
            <h2 class="text-primary my-3">COSA FA LO SCRIPT</h2>
            <img src="./images/javascript-logo-javascript-icon-transparent-free-png.webp" class="w-75">
            <p class="bg-primary text-white">Inserisci un numero e lo script calcolerà i divisori</p>
        </div>

        <div class="col-6 col-sm-4 border border-warning">

            <h2 class="text-primary my-3">IL TUO INPUT</h2>

            <form>
                <input type="number" id="numero">
                <button type="button" class="btn btn-light" onclick="calcolaDiv()">Calcola</button>
            </form>
  

        </div>

        <div class="col-6 col-sm-4 border border-warning">

            <h2 class="text-primary my-3">IL RISULTATO</h2>

            <div class="spinner-border text-danger" role="status" id="spin">
                <span class="visually-hidden">Loading...</span>
            </div>

            <p class="primo" id="contaDiv"></p>

        </div>


    </div> <!--fine row-->


    <script src="./js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
